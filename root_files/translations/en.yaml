configuration:
  show_host:
    name: Show the host system
    description: Mount the machine's own files so the Host place can browse them. Requires Protection mode off.
  mount_usb:
    name: Mount attached disks
    description: Mount USB, SATA, NVMe, and SD disks that are not the Home Assistant system disk. FAT, exFAT, NTFS, and ext4 work. Mac APFS disks do not.
