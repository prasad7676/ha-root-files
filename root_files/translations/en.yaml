configuration:
  show_host:
    name: Show the host system
    description: Mount the machine's own files so the Host place can browse them. Requires Protection mode off.
  mount_usb:
    name: Mount USB drives
    description: Mount USB and other extra disks that are not the Home Assistant system disk. FAT, exFAT, NTFS, and ext4 work. Mac APFS drives do not.
