configuration:
  show_host:
    name: Show the host system
    description: Mount the machine's own files under Host. Leave this off for everyday use. It needs Protection mode off, and only for as long as you need those system files.
  mount_usb:
    name: Mount attached disks
    description: Mount USB, SATA, NVMe, and SD disks that are not the Home Assistant system disk. FAT, exFAT, NTFS, and ext4 work. Mac APFS disks do not.
